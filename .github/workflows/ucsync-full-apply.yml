name: UC-Sync apply completo

# `verify_patch.py` valida a nivel de fichero (rápido). Este trabajo aplica la serie entera
# sobre el tarball oficial "lite" de la versión fijada, igual que hace `utils/patches.py apply`
# al compilar: detecta roturas de la serie de upstream además de la nuestra, y comprueba que
# los símbolos y ficheros que UC-Sync necesita siguen ahí después de parchear.

on:
  workflow_dispatch:
  schedule:
    - cron: '37 8 * * *'

permissions:
  contents: read
  issues: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Hay archivo lite para esta versión?
        id: lite
        run: |
          V="$(cat chromium_version.txt)"
          if curl -sfI "https://commondatastorage.googleapis.com/chromium-browser-official/chromium-$V-lite.tar.xz.hashes" >/dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Chromium $V no tiene archivo oficial 'lite': se omite la validación de la serie completa."
          fi
      - name: Descargar y desempaquetar el tarball lite
        if: steps.lite.outputs.present == 'true'
        run: |
          set -eo pipefail
          mkdir -p build/download_cache work
          python3 utils/downloads.py retrieve -c build/download_cache -i downloads.ini
          python3 utils/downloads.py unpack -c build/download_cache -i downloads.ini -- work/src
      - name: Aplicar la serie completa
        if: steps.lite.outputs.present == 'true'
        run: |
          set -eo pipefail
          python3 utils/prune_binaries.py work/src pruning.list
          python3 utils/patches.py apply work/src patches
          python3 utils/domain_substitution.py apply -r domain_regex.list \
            -f domain_substitution.list -c build/domsubcache.tar.gz work/src
      - name: Comprobar las piezas de UC-Sync
        if: steps.lite.outputs.present == 'true'
        run: |
          set -eo pipefail
          src=work/src
          grep -q "ParseVisitTime" "$src/chrome/browser/extensions/api/history/history_api.cc"
          grep -q "HistoryAddUrlsFunction" "$src/chrome/browser/extensions/api/history/history_api.h"
          grep -q "visitTime" "$src/chrome/common/extensions/api/history.json"
          test -f "$src/chrome/browser/resources/ucsync/manifest.json"
          test -f "$src/chrome/browser/ui/webui/ucsync/ucsync_ui.cc"
          grep -q "EnsureUCSyncBuiltInExtension" "$src/chrome/browser/extensions/extension_service.cc"
          grep -q "lidfhdhmbifmhikiaklbiehnhnkhoghe" "$src/extensions/common/constants.h"
          echo "OK: la serie aplica y UC-Sync queda integrado en $(cat chromium_version.txt)"
      - name: Avisar si rompe
        if: failure() && steps.lite.outputs.present == 'true' 
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          V="$(cat chromium_version.txt)"
          gh issue create --title "UC-Sync: la serie no aplica completa en Chromium $V" --label bug \
            --body "El trabajo «UC-Sync apply completo» falló aplicando la serie sobre el tarball lite de $V. Revisa si fue un parche de upstream o uno de \`patches/extra/ucsync/\`." || true
