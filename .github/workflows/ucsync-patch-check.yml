name: UC-Sync patch check

on:
  workflow_dispatch:
  push:
    branches: ['master', 'main']
  pull_request:
  schedule:
    - cron: '17 6 * * 1'   # lunes: el parche debe seguir aplicando sobre la versión fijada

jobs:
  patch-applies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar la serie de parches
        run: python3 devutils/check_patch_files.py -p patches
      - name: Comprobar que los parches de UC-Sync aplican sobre la versión fijada
        run: python3 ucsync/verify_patch.py
      - name: Comprobar la invariante de las banderas MULTI_VALUE
        run: python3 ucsync/check_flag_choices.py
      - name: Resumen
        run: |
          echo "versión=$(cat chromium_version.txt)" >> "$GITHUB_STEP_SUMMARY"
          python3 ucsync/verify_patch.py --list >> "$GITHUB_STEP_SUMMARY"
