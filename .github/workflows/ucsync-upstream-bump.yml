name: UC-Sync upstream bump

# Fusiona upstream (ungoogled-chromium) y, si nuestros parches siguen aplicando, sube el
# merge y etiqueta la versión. Si rechazan, revierte y abre un issue: nunca deja master roto.
# Cada fase es un step separado para que el log del runner diga exactamente dónde se queda.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión de Chromium a fijar (vacío = la que traiga upstream)'
        required: false
        default: ''
  schedule:
    - cron: '13 7 * * *'

permissions:
  contents: write
  issues: write

env:
  GIT_TERMINAL_PROMPT: 0

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Traer upstream
        run: |
          set -x
          git remote get-url upstream >/dev/null 2>&1 || git remote add upstream https://github.com/ungoogled-software/ungoogled-chromium.git
          timeout 300 git fetch upstream --tags --prune
      - name: Fusionar
        run: |
          set -x
          echo "HEAD=$(git rev-parse HEAD)" > /tmp/bump-state
          echo "VERSION_ANTES=$(cat chromium_version.txt)" >> /tmp/bump-state
          if [ -n "${{ github.event.inputs.version }}" ]; then
            V="${{ github.event.inputs.version }}"
            curl -sfI "https://commondatastorage.googleapis.com/chromium-browser-official/chromium-$V-lite.tar.xz.hashes" >/dev/null || {
              echo "Chromium $V no tiene archivo oficial 'lite'; no se puede validar ni compilar con él." >&2
              exit 1
            }
            echo "$V" > chromium_version.txt
            git add chromium_version.txt
            git -c user.name=ucsync-bot -c user.email=ucsync-bot@users.noreply.github.com \
              commit -m "chromium_version.txt: ${{ github.event.inputs.version }} (adelantando a upstream)"
          fi
          if ! timeout 300 git merge --no-edit upstream/master; then
            git merge --abort || true
            git status --porcelain > /tmp/bump-conflict.txt
            echo "CONFLICTO=1" >> /tmp/bump-state
          fi
      - name: Validar
        run: |
          set -x
          V="$(cat chromium_version.txt)"
          timeout 300 python3 devutils/check_patch_files.py -p patches
          timeout 900 python3 ucsync/verify_patch.py "$V" 2>&1 | tee /tmp/bump-rejects.txt
          echo "VALIDA=1" >> /tmp/bump-state
      - name: Subir o reportar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: ucsync-bot
          GIT_AUTHOR_EMAIL: ucsync-bot@users.noreply.github.com
          GIT_COMMITTER_NAME: ucsync-bot
          GIT_COMMITTER_EMAIL: ucsync-bot@users.noreply.github.com
        run: |
          set -x
          source /tmp/bump-state || true
          V="$(cat chromium_version.txt)"
          if [ "${CONFLICTO:-0}" == "1" ]; then
            gh issue create --title "UC-Sync: conflicto al fusionar upstream (Chromium $V)" --label bug \
              --body "Upstream trae cambios que chocan con el árbol del fork. Ficheros en conflicto en el log del step «Fusionar»." || true
            exit 2
          fi
          if [ "$(git rev-parse HEAD)" == "$(git rev-parse origin/master)" ]; then
            echo "Nada nuevo de upstream (Chromium $V)."
            exit 0
          fi
          timeout 300 git push origin HEAD:master
          TAG="chromium-$V"
          git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || git tag -a "$TAG" -m "Chromium $V con los parches de UC-Sync"
          git push origin "refs/tags/$TAG" || true
          echo "Subido master y etiquetado $TAG."
