name: UC-Sync vendor extensión

# 0003 es una copia de `extension/` del repo UC-Sync. Este trabajo re-vende esa copia cuando
# cambia la extensión y deja registrado en `ucsync/extension.lock.json` de qué commit viene.
# Necesita el secret `UCSYNC_PAT` (un token con lectura sobre el repo UC-Sync); sin él se
# limita a comprobar si el lock coincide con el parche guardado.

on:
  workflow_dispatch:
  repository_dispatch:
    types: [ucsync-extension-updated]

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Traer la extensión de UC-Sync
        id: ext
        env:
          PAT: ${{ secrets.UCSYNC_PAT }}
          REF: ${{ github.event.client_payload.ref || 'main' }}
        run: |
          set -eo pipefail
          if [ -z "$PAT" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Sin UCSYNC_PAT: no se puede leer el repo UC-Sync (privado)."
            exit 0
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"
          git clone --depth 1 --branch "$REF" \
            "https://ucsync-bot:${PAT}@github.com/dr0per250/uc-sync.git" /tmp/uc-sync
          echo "commit=$(git -C /tmp/uc-sync rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "EXT_COMMIT=$(git -C /tmp/uc-sync rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Re-vender 0003 y registrar el lock
        if: steps.ext.outputs.present == 'true'
        run: |
          set -eo pipefail
          ./ucsync/make_ucsync_patches.sh --only 0003 --extension /tmp/uc-sync/extension
          ./ucsync/record_extension_lock.sh /tmp/uc-sync
      - name: Subir si cambió
        if: steps.ext.outputs.present == 'true'
        env:
          GIT_AUTHOR_NAME: ucsync-bot
          GIT_AUTHOR_EMAIL: ucsync-bot@users.noreply.github.com
          GIT_COMMITTER_NAME: ucsync-bot
          GIT_COMMITTER_EMAIL: ucsync-bot@users.noreply.github.com
        run: |
          set -eo pipefail
          if git diff --quiet -- patches/extra/ucsync/0003-ucsync-browser-extension.patch ucsync/extension.lock.json; then
            echo "La extensión embebida ya estaba al día."
            exit 0
          fi
          git add patches/extra/ucsync/0003-ucsync-browser-extension.patch ucsync/extension.lock.json
          git commit -m "ucsync: extensión embebida desde UC-Sync ${EXT_COMMIT:0:7}"
          git push origin master
