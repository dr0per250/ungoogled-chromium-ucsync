name: UC-Sync chromium-web-store check

# chromium-web-store se vende dentro del navegador (parche 0006). Este trabajo vigila si NeverDecaf
# publica una versión nueva y abre un issue con lo que hay que hacer; no toca el código.
on:
  schedule:
    - cron: '30 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comparar la versión vendida con el último release
        id: cmp
        run: |
          vendida=$(python3 -c "import json;print(json.load(open('ucsync/webstore.lock.json'))['extensionVersion'])")
          ultima=$(curl -fsSL https://api.github.com/repos/NeverDecaf/chromium-web-store/releases/latest | python3 -c "import json,sys;print(json.load(sys.stdin)['tag_name'].lstrip('v'))")
          echo "vendida=$vendida"
          echo "ultima=$ultima"
          echo "vendida=$vendida" >> "$GITHUB_OUTPUT"
          echo "ultima=$ultima" >> "$GITHUB_OUTPUT"
          if [ "$vendida" != "$ultima" ]; then
            echo "nueva=1" >> "$GITHUB_OUTPUT"
          else
            echo "nueva=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Abrir un issue si hay versión nueva
        if: steps.cmp.outputs.nueva == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          vendida="${{ steps.cmp.outputs.vendida }}"
          ultima="${{ steps.cmp.outputs.ultima }}"
          if gh issue list --state open --search "chromium-web-store $ultima" --json number --jq '.[].number' | grep -q .; then
            echo "Ya hay un issue abierto para $ultima."
            exit 0
          fi
          gh issue create \
            --title "Actualiza chromium-web-store a $ultima (vendido: $vendida)" \
            --body "NeverDecaf publicó \`$ultima\` y el navegador vende \`$vendida\`.

Pasos:

\`\`\`sh
git clone --depth 1 --branch v$ultima https://github.com/NeverDecaf/chromium-web-store.git /tmp/cws
./ucsync/vendor_webstore.sh --src <árbol-de-chromium> --repo /tmp/cws
./ucsync/make_ucsync_patches.sh --src <árbol-de-chromium> --extension <uc-sync>   # regenera 0006
python3 ucsync/verify_patch.py                                                   # debe decir ✓
\`\`\`

Si cambia el campo \`key\` del manifiesto, hay que actualizar \`kChromiumWebStoreExtensionId\` en
\`extensions/common/constants.h\` (dentro de 0004) y avisar: las extensiones ya instaladas desde la
tienda quedarían con otra identidad."
